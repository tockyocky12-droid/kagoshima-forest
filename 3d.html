<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3Dで見る（試作）</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#cfe3ef;font-family:"Zen Kaku Gothic New","BIZ UDGothic",sans-serif;-webkit-user-select:none;user-select:none}
#view{position:fixed;inset:0;touch-action:none}
#bar{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 60px 8px 12px;background:linear-gradient(rgba(16,32,24,.75),rgba(16,32,24,0));color:#fff;pointer-events:none}
#ttl{font-weight:700;font-size:17px;text-shadow:0 1px 3px #000;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tag{flex:none}
#tag{font-size:11px;border:1px solid rgba(255,255,255,.7);border-radius:8px;padding:1px 6px}
#ex{position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.92);border-radius:12px;padding:5px 6px;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:12px;color:#234}
#ex span{padding:0 4px}
#ex button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:7px 9px;background:#e6efe8;color:#234}
#ex button[aria-pressed=true]{background:#2c8a50;color:#fff}
#info{position:fixed;right:12px;max-width:70vw;text-align:right;bottom:calc(66px + env(safe-area-inset-bottom,0px));font-size:11px;color:#234;background:rgba(255,255,255,.85);border-radius:8px;padding:3px 7px}
#msg{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);background:rgba(16,32,24,.85);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;max-width:80vw;text-align:center}
#attr{position:fixed;left:12px;top:calc(64px + env(safe-area-inset-top,0px));font-size:9.5px;color:#234;background:rgba(255,255,255,.75);border-radius:6px;padding:1px 6px}
#help{position:fixed;left:12px;top:calc(46px + env(safe-area-inset-top,0px));font-size:11px;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none}
</style></head>
<body>
<div id="view"></div>
<div id="bar"><span id="ttl"></span><span id="tag">3D 試作</span></div>
<div id="help">1本指：回す　2本指：移動・拡大</div>
<div id="ex"><span>高さ</span><button type="button" data-v="1" aria-pressed="false">×1</button><button type="button" data-v="1.5" aria-pressed="true">×1.5</button><button type="button" data-v="2" aria-pressed="false">×2</button></div>
<div id="info"></div>
<div id="attr">地理院タイル（写真・標高）・地番：法務省 登記所備付地図データ</div>
<div id="msg">準備しています…</div>
<script src="./lib/viewer3d/viewer3d.js?v=20261117d"></script>
</body></html>
